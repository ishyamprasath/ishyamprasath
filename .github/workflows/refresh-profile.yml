name: Refresh profile

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'profile/profile.json'
      - 'scripts/generate_profile.py'
      - 'assets/portrait.png'
      - 'tests/**'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: read

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test contribution parsing and rendering
        run: python3 -m unittest discover -s tests -v
      - name: Refresh public activity and render artwork
        run: python3 scripts/generate_profile.py --refresh
      - name: Commit generated files when changed
        run: |
          git add assets/ profile/contributions.json
          if git diff --cached --quiet; then
            echo "Profile artwork is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile artwork and contribution activity"
          git push
