<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="830" viewBox="0 0 1180 830" role="img" aria-labelledby="title" font-family="DejaVu Sans,Arial,sans-serif">
<title id="title">Selected projects by Shyam Prasath S</title>
<defs><linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66e5d3"/><stop offset=".48" stop-color="#b6a0ff"/><stop offset="1" stop-color="#edbd70"/></linearGradient><linearGradient id="sheen"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#26364b" stroke-width=".6"/></pattern></defs>
<style>.pulse{animation:pulse 3s ease-in-out infinite}.id-card{transform-origin:260px 390px;animation:cardFloat 9s ease-in-out infinite}.shine{animation:shine 7s ease-in-out infinite}.edge{stroke-dasharray:80 1000;animation:edge 12s linear infinite}.project{animation:levitate 7s ease-in-out infinite;animation-delay:var(--delay,0s)}.circuit{stroke-dasharray:12 140;animation:circuit 9s linear infinite}.orbit{transform-origin:260px 337px;animation:orbit 32s linear infinite}.cursor{animation:blink 1.2s steps(1) infinite}.phase-a{animation:phaseA 12s infinite}.phase-b{opacity:0;animation:phaseB 12s infinite}.phase-c{opacity:0;animation:phaseC 12s infinite}@keyframes cardFloat{0%,100%{transform:perspective(1100px) rotateY(-9deg) rotateX(5deg) rotateZ(-2deg) translateY(-5px)}50%{transform:perspective(1100px) rotateY(9deg) rotateX(-4deg) rotateZ(2deg) translateY(7px)}}@keyframes shine{0%,20%{transform:translateX(-500px)}70%,100%{transform:translateX(900px)}}@keyframes edge{to{stroke-dashoffset:-2160}}@keyframes circuit{to{stroke-dashoffset:-608}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes blink{50%{opacity:0}}@keyframes levitate{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes phaseA{0%,28%,100%{opacity:1}33%,95%{opacity:0}}@keyframes phaseB{0%,28%,66%,100%{opacity:0}33%,61%{opacity:1}}@keyframes phaseC{0%,61%,100%{opacity:0}66%,95%{opacity:1}}@keyframes travel{from{stroke-dashoffset:var(--start)}to{stroke-dashoffset:var(--end)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.snake{display:none}}</style>
<rect x="1" y="1" width="1178" height="828" rx="22" fill="#090e1a" stroke="#26364b"/>
<text x="36" y="38" font-size="11" fill="#66e5d3" font-family="monospace" letter-spacing="1.5">SELECTED WORK / 2024–2026</text>
<text x="36" y="82" font-size="28" fill="#edf4ff" font-weight="700">From experiments to useful systems.</text>
