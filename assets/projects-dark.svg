<text x="52" y="231" font-size="16" fill="#a3b4cd" >tracking and driver-rider matching.</text>
<text x="52" y="267" font-size="12" fill="#66e5d3" font-family="monospace">React Native / AWS</text>
<path d="M52 283H562" stroke="#26364b"/>
<text x="52" y="305" font-size="12" fill="#7086a5" >Dendo · Google Play + Apple App Store</text>
