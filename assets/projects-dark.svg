<text x="618" y="600" font-size="10" fill="#b6a0ff" font-family="monospace" letter-spacing="1.5">06 / INTELLIGENT HARDWARE</text>
<text x="618" y="636" font-size="25" fill="#edf4ff" font-weight="700">FabPal</text>
